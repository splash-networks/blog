---
layout: default
---

<article>
  {% include meta.html post=page %}
  {% include anchor_headings.html html=content %}
  {% if page.comments != false and site.comments.isso or site.comments.disqus %}
    <hr>
    {% if site.comments.isso_domain %}<div id="isso-thread"></div>{% endif %}
    {% if site.comments.disqus_shortname %}<div id="disqus_thread"></div>{% endif %}
    <noscript>Please enable JavaScript to view comments.</noscript>
  {% endif %}
</article>

<script>
  // Clicking a heading's "#" also copies the section link
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a.anchor');
    if (!a || !navigator.clipboard) return;
    navigator.clipboard.writeText(a.href).then(function () {
      a.classList.add('copied');
      setTimeout(function () { a.classList.remove('copied'); }, 1500);
    }, function () {});
  });
</script>
